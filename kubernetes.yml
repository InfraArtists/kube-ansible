- hosts: all
  become: true
  roles:
    - role: preinstall
  gather_facts: yes
  any_errors_fatal: true
  tags: [preinstall]

- hosts: k8s
  become: true
  roles:
    - role: k8s
  gather_facts: yes
  any_errors_fatal: true
  tags: [k8s]

- hosts: k8s
  become: true
  roles:
    - role: init_k8s
  gather_facts: yes
  any_errors_fatal: true
  tags: [init_k8s]


- hosts: k8s_masters
  become: true
  roles:
    - role: preinstall
    - role: k8s
    - role: join_master
  gather_facts: yes
  any_errors_fatal: true
  tags: [join_master]

- hosts: k8s_workers
  become: true
  roles:
    - role: preinstall
    - role: k8s
    - role: join_worker
  gather_facts: yes
  any_errors_fatal: true
  tags: [join_worker]

- hosts: lb
  become: true
  roles:
    - role: preinstall
    - role: lb
  gather_facts: yes
  any_errors_fatal: true
  tags: [lb]

- hosts: all
  become: true
  roles:
    - role: postinstall
  gather_facts: yes
  any_errors_fatal: true
  tags: [postinstall]
